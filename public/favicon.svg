<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3498db"/>
      <stop offset="1" stop-color="#1a5276"/>
    </linearGradient>
  </defs>
  <!-- Shield body -->
  <path d="M16 2L4 7v9c0 8.2 6.8 13.8 12 15.2C17.2 29.8 28 24.2 28 16V7L16 2z"
